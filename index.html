<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOM's Desktop 🐧</title>
    <meta name="description" content="OOM's playful personal desktop — draggable GNOME-style windows, a fully working fake terminal, and one (1) rickroll." />
    <meta name="theme-color" content="#667eea" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OOM's Desktop 🐧" />
    <meta property="og:description" content="A GNOME-style personal desktop with draggable windows, a working terminal, and a little rickroll." />
    <link rel="icon" type="image/png" sizes="32x32" href="https://avatars.githubusercontent.com/u/64982545?s=64&v=4">
    <link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/64982545?s=180&v=4">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles" id="particles" aria-hidden="true"></div>

    <div class="top-bar">
        <button class="activities" id="activities" type="button" aria-label="Activities">Activities</button>
        <div style="flex: 1;"></div>
        <div class="top-bar-right">
            <button class="status-icon" type="button" title="Network" aria-label="Network">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            </button>
            <button class="status-icon" type="button" title="Volume" aria-label="Volume">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <button class="status-icon" id="appSwitcher" type="button" title="Apps" aria-label="Open apps" aria-haspopup="true" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg>
            </button>
            <button class="status-icon" type="button" title="Battery" aria-label="Battery">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="13" x2="23" y2="11"/><rect x="3" y="8" width="12" height="8" fill="currentColor" opacity="0.5"/></svg>
            </button>
            <div id="statusClock" style="color: #fff; font-weight: bold; font-size: 14px;" aria-live="polite">--:--</div>
        </div>
    </div>

    <main>
        <div class="dash" id="dash" role="toolbar" aria-label="Applications">
        <button class="dash-icon" type="button" data-window="firefox" data-label="Firefox" title="Firefox" aria-label="Open Firefox">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12a4 4 0 0 1 8 0"/><path d="M12 8v4l2 2"/></svg>
        </button>
        <button class="dash-icon" type="button" data-window="terminal" data-label="Terminal" title="Terminal" aria-label="Open Terminal">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        </button>
        <button class="dash-icon" type="button" data-window="profile" data-label="Profile" title="Profile" aria-label="Open Profile">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
        </button>
        <button class="dash-icon" type="button" data-window="birthday" data-label="Birthday" title="Birthday" aria-label="Open Birthday">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v4m-2-2h4"/><rect x="4" y="8" width="16" height="14" rx="2"/><path d="M8 12h8"/></svg>
        </button>
        <button class="dash-icon" type="button" data-window="likes" data-label="Likes" title="Likes" aria-label="Open Likes">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <button class="dash-icon" type="button" data-window="dislikes" data-label="Dislikes" title="Dislikes" aria-label="Open Dislikes">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h0a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><line x1="12" y1="8" x2="12" y2="4"/></svg>
        </button>
        <button class="dash-icon" type="button" data-window="languages" data-label="Languages" title="Languages" aria-label="Open Languages">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        <button class="dash-icon" type="button" data-window="games" data-label="Games" title="Games" aria-label="Open Games">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="17" cy="10" r="1"/><circle cx="15" cy="12" r="1"/></svg>
        </button>
        <button class="dash-icon" type="button" data-window="animals" data-label="Animals" title="Animals" aria-label="Open Animals">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="10" r="3"/><circle cx="7" cy="6" r="2"/><circle cx="17" cy="6" r="2"/><path d="M12 13c-4 0-7 3-7 6v1h14v-1c0-3-3-6-7-6z"/></svg>
        </button>
    </div>
    </main>

    <div class="app-menu" id="appMenu" aria-label="Running applications"></div>

    <script src="app.js"></script>
</body>
</html>
