<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOM's Desktop 🐧</title>
    <meta name="description" content="OOM's desktop, stripped down to the essentials: one fully working fake terminal." />
    <meta name="theme-color" content="#667eea" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OOM's Desktop 🐧" />
    <meta property="og:description" content="A GNOME-style desktop with a fully working terminal." />
    <link rel="icon" type="image/png" sizes="32x32" href="https://avatars.githubusercontent.com/u/64982545?s=64&v=4">
    <link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/64982545?s=180&v=4">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles" id="particles" aria-hidden="true"></div>

    <div class="top-bar">
        <button class="activities" id="activities" type="button" aria-label="Activities">Activities</button>
        <div style="flex: 1;"></div>
        <div class="top-bar-right">
            <button class="status-icon" type="button" title="Network" aria-label="Network">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            </button>
            <button class="status-icon" type="button" title="Volume" aria-label="Volume">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <button class="status-icon" id="appSwitcher" type="button" title="Apps" aria-label="Open apps" aria-haspopup="true" aria-expanded="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="19" r="1"/><circle cx="19" cy="19" r="1"/></svg>
            </button>
            <button class="status-icon" type="button" title="Battery" aria-label="Battery">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="13" x2="23" y2="11"/><rect x="3" y="8" width="12" height="8" fill="currentColor" opacity="0.5"/></svg>
            </button>
            <div id="statusClock" style="color: #fff; font-weight: bold; font-size: 14px;" aria-live="polite">--:--</div>
        </div>
    </div>

    <main>
        <div class="dash" id="dash" role="toolbar" aria-label="Applications">
        <button class="dash-icon" type="button" data-window="terminal" data-label="Terminal" title="Terminal" aria-label="Open Terminal">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        </button>
    </div>
    </main>

    <div class="app-menu" id="appMenu" aria-label="Running applications"></div>

    <script src="app.js"></script>
</body>
</html>
